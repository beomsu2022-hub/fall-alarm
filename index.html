<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111316">
<title>안전계단 쓰러짐 알림</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-width column — status panel up top, settings folded, event log below; alarm takes the whole screen */
:root {
  --bg: #ECEEF1;
  --surface: #FFFFFF;
  --fg: #15181C;
  --muted: #59616B;
  --line: #D3D8DE;
  --hazard: #F2B400;
  --hazard-ink: #7A5400;
  --ok: #17824A;
  --alarm: #D2231B;
  --alarm-fg: #FFFFFF;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111316; --surface: #1A1E23; --fg: #ECEEF1; --muted: #98A1AB; --line: #2B3138;
    --hazard: #F5BA0A; --hazard-ink: #F5BA0A; --ok: #3BC97C; --alarm: #E5342A; --alarm-fg: #FFFFFF;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111316; --surface: #1A1E23; --fg: #ECEEF1; --muted: #98A1AB; --line: #2B3138;
  --hazard: #F5BA0A; --hazard-ink: #F5BA0A; --ok: #3BC97C; --alarm: #E5342A; --alarm-fg: #FFFFFF;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 16px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
  -webkit-tap-highlight-color: transparent;
}
.wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }

header { display: flex; flex-direction: column; gap: 10px; }
.eyebrow { font-size: 13px; font-weight: 600; letter-spacing: .06em; color: var(--hazard-ink); }
h1 { margin: 0; font-size: 28px; line-height: 1.2; font-weight: 700; text-wrap: balance; }
.stripe {
  height: 8px; border-radius: 2px;
  background: repeating-linear-gradient(-45deg, var(--hazard) 0 12px, var(--fg) 12px 24px);
}

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }

.status { display: flex; align-items: center; gap: 12px; }
.dot { width: 14px; height: 14px; border-radius: 50%; background: var(--muted); flex: none; }
.status[data-state="on"] .dot { background: var(--ok); box-shadow: 0 0 0 0 var(--ok); animation: pulse 2s infinite; }
.status[data-state="lost"] .dot, .status[data-state="fail"] .dot { background: var(--alarm); }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--ok) 55%, transparent); } 100% { box-shadow: 0 0 0 12px transparent; } }
.status-text { font-size: 22px; font-weight: 700; line-height: 1.25; }
.status[data-state="on"] .status-text { color: var(--ok); }
.status[data-state="lost"] .status-text, .status[data-state="fail"] .status-text { color: var(--alarm); }
.device { font-family: var(--font-mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

.notice { border-left: 4px solid var(--hazard); background: color-mix(in srgb, var(--hazard) 14%, var(--surface)); padding: 10px 12px; border-radius: 0 6px 6px 0; font-size: 14px; }
.notice strong { display: block; margin-bottom: 2px; }

.actions { display: grid; grid-template-columns: 1fr; gap: 10px; }
button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); padding: 12px 16px; font-weight: 600; min-height: 48px; }
button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible { outline: 3px solid var(--hazard); outline-offset: 2px; }
.btn-main { background: var(--fg); color: var(--bg); border-color: var(--fg); font-size: 17px; min-height: 56px; }
.btn-ghost { background: transparent; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row > button { flex: 1 1 140px; }

.checks { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font-size: 13px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
.chip[data-ok="1"] { color: var(--fg); }
.chip[data-ok="1"]::before { background: var(--ok); }

details.panel { gap: 0; }
summary { cursor: pointer; font-weight: 600; list-style: none; display: flex; justify-content: space-between; align-items: center; min-height: 28px; }
summary::-webkit-details-marker { display: none; }
summary::after { content: "열기"; font-size: 13px; font-weight: 500; color: var(--muted); }
details[open] summary::after { content: "접기"; }
.fields { display: flex; flex-direction: column; gap: 14px; margin-top: 14px; }
label { display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600; }
.hint { font-weight: 400; color: var(--muted); font-size: 13px; }
input, select { font: inherit; font-family: var(--font-mono); padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); min-height: 46px; width: 100%; }

.log-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
h2 { margin: 0; font-size: 17px; }
.count { font-family: var(--font-mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.log { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.log li { display: grid; grid-template-columns: 74px 44px 1fr; gap: 10px; align-items: baseline; padding: 9px 0; border-top: 1px solid var(--line); font-size: 14px; }
.log li:first-child { border-top: 0; }
.log time { font-family: var(--font-mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.tag { font-size: 12px; font-weight: 600; color: var(--muted); }
.log .msg { min-width: 0; overflow-wrap: anywhere; font-family: var(--font-mono); font-size: 13.5px; }
.log li[data-kind="alarm"] .tag, .log li[data-kind="alarm"] .msg { color: var(--alarm); font-weight: 600; }
.log li[data-kind="sys"] .msg { font-family: var(--font-body); color: var(--muted); }
.empty { color: var(--muted); font-size: 14px; margin: 0; }

/* full-screen alarm */
.alarm {
  position: fixed; inset: 0; z-index: 50;
  background: var(--alarm); color: var(--alarm-fg);
  display: flex; flex-direction: column; justify-content: center; align-items: stretch; gap: 22px;
  padding: calc(24px + env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px));
  text-align: center;
  animation: flash 1s steps(1) infinite;
}
@keyframes flash { 50% { background: #7A0E09; } }
.alarm .big { font-size: clamp(40px, 13vw, 64px); font-weight: 700; line-height: 1.1; margin: 0; }
.alarm .place { font-size: clamp(30px, 10vw, 46px); font-weight: 700; line-height: 1.2; margin: 0; }
.alarm .when { font-family: var(--font-mono); font-size: 20px; font-variant-numeric: tabular-nums; }
.alarm .src { font-size: 15px; opacity: .9; overflow-wrap: anywhere; }
.alarm button { background: #FFFFFF; color: #7A0E09; border: 0; font-size: 22px; min-height: 72px; max-width: 420px; width: 100%; margin: 12px auto 0; }

@media (prefers-reduced-motion: reduce) {
  .alarm { animation: none; }
  .status[data-state="on"] .dot { animation: none; }
}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <span class="eyebrow">태양광 ESS 스마트 안전계단</span>
    <h1>쓰러짐 알림</h1>
    <div class="stripe" aria-hidden="true"></div>
  </header>

  <section class="panel" aria-label="연결 상태">
    <div class="status" id="status" data-state="idle" aria-live="polite">
      <span class="dot" aria-hidden="true"></span>
      <div>
        <div class="status-text" id="statusText">연결 안 됨</div>
        <div class="device" id="deviceLine">HC-06 · 9600 bps</div>
      </div>
    </div>

    <div class="notice" id="notice" hidden></div>

    <div class="actions">
      <button class="btn-main" id="connectBtn" type="button">블루투스 연결</button>
      <button class="btn-ghost" id="disconnectBtn" type="button" hidden>연결 끊기</button>
    </div>

    <div class="checks" aria-label="알람 준비 상태">
      <span class="chip" id="chipSound" data-ok="0">소리 준비</span>
      <span class="chip" id="chipWake" data-ok="0">화면 꺼짐 방지</span>
      <span class="chip" id="chipVibe" data-ok="0">진동</span>
    </div>

    <div class="row">
      <button type="button" id="soundBtn">소리 확인</button>
      <button type="button" id="testBtn">알람 테스트</button>
    </div>
  </section>

  <details class="panel" id="settings">
    <summary>신호 설정</summary>
    <div class="fields">
      <label for="keyword">알람 신호 문자
        <span class="hint">보드가 이 글자를 보내면 알람이 울립니다. 대소문자는 구분하지 않아요.</span>
        <input id="keyword" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" value="FALL">
      </label>
      <label for="baud">통신 속도
        <span class="hint">HC-06 기본값은 9600입니다. 아두이노 코드의 begin() 값과 같아야 해요.</span>
        <select id="baud">
          <option value="9600" selected>9600</option>
          <option value="19200">19200</option>
          <option value="38400">38400</option>
          <option value="57600">57600</option>
          <option value="115200">115200</option>
        </select>
      </label>
    </div>
  </details>

  <section class="panel" aria-label="받은 신호 기록">
    <div class="log-head">
      <h2>받은 신호 기록</h2>
      <span class="count" id="alarmCount">알람 0회</span>
    </div>
    <p class="empty" id="emptyLog">연결하면 보드가 보낸 신호가 시간순으로 여기에 쌓입니다. 알람 신호는 빨간색으로 표시돼요.</p>
    <ul class="log" id="log"></ul>
  </section>
</div>

<div class="alarm" id="alarm" role="alertdialog" aria-labelledby="alarmTitle" hidden>
  <p class="big" id="alarmTitle">쓰러짐 감지</p>
  <p class="place" id="alarmPlace" hidden></p>
  <div class="when" id="alarmWhen">--:--:--</div>
  <div class="src" id="alarmSrc"></div>
  <button type="button" id="dismissBtn">알람 끄기</button>
</div>

<script>
(function () {
  const $ = (s) => document.querySelector(s);
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };

  let port = null, reader = null, keepReading = false;
  let audioCtx = null, siren = null, vibeTimer = null, wakeLock = null;
  let alarmOn = false, alarmCount = 0;

  const keywordEl = $("#keyword"), baudEl = $("#baud");
  keywordEl.value = store.get("fa_keyword", "FALL");
  baudEl.value = store.get("fa_baud", "9600");
  keywordEl.addEventListener("change", () => { keywordEl.value = keywordEl.value.trim() || "FALL"; store.set("fa_keyword", keywordEl.value); });
  baudEl.addEventListener("change", () => { store.set("fa_baud", baudEl.value); updateDevice(); });

  const chromeVer = (navigator.userAgent.match(/Chrome\/(\d+)/) || [])[1];
  function updateDevice() {
    $("#deviceLine").textContent = "HC-06 · " + baudEl.value + " bps · " + (chromeVer ? "크롬 " + chromeVer : "크롬 아님");
  }
  updateDevice();

  function pad(n) { return String(n).padStart(2, "0"); }
  function now() { const d = new Date(); return pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds()); }

  const TAGS = { rx: "수신", alarm: "알람", sys: "알림" };
  function log(kind, text) {
    $("#emptyLog").hidden = true;
    const li = document.createElement("li");
    li.dataset.kind = kind;
    const t = document.createElement("time"); t.textContent = now();
    const g = document.createElement("span"); g.className = "tag"; g.textContent = TAGS[kind];
    const m = document.createElement("span"); m.className = "msg"; m.textContent = text;
    li.append(t, g, m);
    const list = $("#log");
    list.prepend(li);
    while (list.children.length > 150) list.lastChild.remove();
  }

  const STATES = {
    idle: "연결 안 됨",
    connecting: "연결 중…",
    on: "연결됨 · 감시 중",
    lost: "연결 끊김",
    fail: "연결 실패"
  };
  function setStatus(s) {
    $("#status").dataset.state = s;
    $("#statusText").textContent = STATES[s];
    const live = s === "on";
    $("#connectBtn").hidden = live;
    $("#disconnectBtn").hidden = !live;
    $("#connectBtn").textContent = (s === "lost" || s === "fail") ? "다시 연결" : "블루투스 연결";
    $("#connectBtn").disabled = s === "connecting";
  }

  function showNotice(title, body) {
    const n = $("#notice");
    n.replaceChildren();
    const s = document.createElement("strong"); s.textContent = title;
    n.append(s, document.createTextNode(body));
    n.hidden = false;
  }
  function hideNotice() { $("#notice").hidden = true; }

  if (!("serial" in navigator)) {
    showNotice("이 브라우저에서는 블루투스 연결을 쓸 수 없어요.",
      "안드로이드 폰의 크롬 최신 버전으로 이 주소를 열어 주세요. 아이폰과 다른 브라우저는 지원하지 않습니다.");
  }
  if (!("vibrate" in navigator)) $("#chipVibe").textContent = "진동 미지원";
  else $("#chipVibe").dataset.ok = "1";

  /* ---------- sound ---------- */
  function unlockAudio() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
      $("#chipSound").dataset.ok = "1";
    } catch (e) {}
  }
  function startSiren() {
    unlockAudio();
    if (!audioCtx || siren) return;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    const lfo = audioCtx.createOscillator(), depth = audioCtx.createGain();
    osc.type = "square"; osc.frequency.value = 880;
    lfo.type = "triangle"; lfo.frequency.value = 1.5; depth.gain.value = 300;
    gain.gain.value = 0.22;
    lfo.connect(depth).connect(osc.frequency);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(); lfo.start();
    siren = { osc, lfo, gain };
  }
  function stopSiren() {
    if (!siren) return;
    try { siren.osc.stop(); siren.lfo.stop(); siren.gain.disconnect(); } catch (e) {}
    siren = null;
  }
  function beep(times) {
    unlockAudio();
    if (!audioCtx) return;
    for (let i = 0; i < times; i++) {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      const t = audioCtx.currentTime + i * 0.3;
      o.frequency.value = 660; g.gain.setValueAtTime(0.2, t); g.gain.setValueAtTime(0, t + 0.18);
      o.connect(g).connect(audioCtx.destination); o.start(t); o.stop(t + 0.2);
    }
  }

  /* ---------- screen on ---------- */
  async function requestWake() {
    try {
      if (!("wakeLock" in navigator)) return;
      wakeLock = await navigator.wakeLock.request("screen");
      $("#chipWake").dataset.ok = "1";
      wakeLock.addEventListener("release", () => { $("#chipWake").dataset.ok = "0"; });
    } catch (e) { $("#chipWake").dataset.ok = "0"; }
  }
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && port && keepReading) requestWake();
  });

  /* ---------- alarm ---------- */
  let alarmPlaces = [];
  function triggerAlarm(place, source) {
    alarmCount++;
    $("#alarmCount").textContent = "알람 " + alarmCount + "회";
    if (place && !alarmPlaces.includes(place)) alarmPlaces.push(place);
    $("#alarmPlace").textContent = alarmPlaces.join(", ");
    $("#alarmPlace").hidden = alarmPlaces.length === 0;
    $("#alarmSrc").textContent = source;
    if (alarmOn) return;
    alarmOn = true;
    $("#alarmWhen").textContent = now();
    $("#alarm").hidden = false;
    $("#dismissBtn").focus();
    startSiren();
    if ("vibrate" in navigator) {
      navigator.vibrate([700, 300, 700, 300, 700]);
      vibeTimer = setInterval(() => navigator.vibrate([700, 300, 700, 300, 700]), 3000);
    }
  }
  function dismissAlarm() {
    alarmOn = false;
    alarmPlaces = [];
    $("#alarm").hidden = true;
    stopSiren();
    clearInterval(vibeTimer); vibeTimer = null;
    if ("vibrate" in navigator) navigator.vibrate(0);
    log("sys", "알람을 껐어요");
  }
  $("#dismissBtn").addEventListener("click", dismissAlarm);

  function matches(text) {
    const k = (keywordEl.value || "FALL").trim().toUpperCase();
    return k && text.toUpperCase().includes(k);
  }
  /* 보드 형식: "FALL:0" = 진입로, "FALL:1"~"FALL:4" = 계단 번호 */
  function placeOf(line) {
    const m = line.match(/FALL\s*:\s*(\d+)/i);
    if (!m) return "";
    const n = Number(m[1]);
    return n === 0 ? "진입로" : n + "번 계단";
  }
  function handleLine(line) {
    if (matches(line)) {
      const p = placeOf(line);
      log("alarm", p ? line + " · " + p : line);
      triggerAlarm(p, "받은 신호: " + line);
    }
    else log("rx", line);
  }

  /* ---------- bluetooth serial ---------- */
  async function connect() {
    unlockAudio();
    hideNotice();
    if (!("serial" in navigator)) {
      showNotice("이 브라우저에서는 블루투스 연결을 쓸 수 없어요.",
        "안드로이드 폰의 크롬 최신 버전으로 이 주소를 열어 주세요.");
      return;
    }
    setStatus("connecting");
    try {
      /* HC-06은 표준 블루투스 시리얼(SPP)이라, SPP 기기를 목록에 띄우도록 명시한다 */
      const SPP = "00001101-0000-1000-8000-00805f9b34fb";
      port = await navigator.serial.requestPort({
        filters: [{ bluetoothServiceClassId: SPP }],
        allowedBluetoothServiceClassIds: [SPP]
      });
    } catch (e) {
      port = null;
      if (e.name === "NotFoundError") { setStatus("idle"); log("sys", "기기 선택을 취소했어요"); return; }
      if (e.name === "SecurityError") {
        setStatus("fail");
        showNotice("이 주소에서는 블루투스 접근이 막혀 있어요.",
          "직접 올린 https 주소(예: GitHub Pages)에서 열어야 블루투스를 쓸 수 있습니다.");
        return;
      }
      setStatus("fail"); log("sys", "연결 실패: " + e.message); return;
    }
    try {
      await port.open({ baudRate: Number(baudEl.value) });
    } catch (e) {
      setStatus("fail");
      log("sys", "포트를 열지 못했어요: " + e.message);
      showNotice("HC-06을 열지 못했어요.",
        "모듈 전원이 켜져 있는지, 다른 앱(앱 인벤터 등)이 이미 연결하고 있지 않은지 확인한 뒤 다시 연결해 주세요.");
      try { await port.close(); } catch (_) {}
      port = null;
      return;
    }
    setStatus("on");
    log("sys", "HC-06에 연결됐어요. 신호를 기다리는 중");
    requestWake();
    readLoop();
  }

  async function readLoop() {
    keepReading = true;
    const decoder = new TextDecoder();
    let buf = "", flushTimer = null;
    const flush = () => { const l = buf.trim(); buf = ""; if (l) handleLine(l); };
    while (port && port.readable && keepReading) {
      reader = port.readable.getReader();
      try {
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buf += decoder.decode(value, { stream: true });
          let m;
          while ((m = buf.match(/\r?\n|\r/))) {
            const line = buf.slice(0, m.index).trim();
            buf = buf.slice(m.index + m[0].length);
            if (line) handleLine(line);
          }
          if (buf.length > 120) flush();
          clearTimeout(flushTimer);
          if (buf) flushTimer = setTimeout(flush, 300);
        }
      } catch (e) {
        if (keepReading) log("sys", "수신 오류: " + e.message);
        break;
      } finally {
        try { reader.releaseLock(); } catch (_) {}
        reader = null;
      }
    }
    const unexpected = keepReading;
    keepReading = false;
    try { await port.close(); } catch (_) {}
    port = null;
    if (unexpected) {
      setStatus("lost");
      log("sys", "연결이 끊겼어요");
      showNotice("HC-06과 연결이 끊겼어요.", "이대로는 쓰러짐 알람을 받을 수 없습니다. 모듈 전원과 거리를 확인하고 다시 연결해 주세요.");
      beep(3);
      if ("vibrate" in navigator) navigator.vibrate([200, 100, 200]);
    }
  }

  async function disconnect() {
    keepReading = false;
    try { if (reader) await reader.cancel(); } catch (_) {}
    setStatus("idle");
    log("sys", "연결을 끊었어요");
    try { if (wakeLock) await wakeLock.release(); } catch (_) {}
  }

  $("#connectBtn").addEventListener("click", connect);
  $("#disconnectBtn").addEventListener("click", disconnect);
  $("#soundBtn").addEventListener("click", () => { unlockAudio(); beep(2); });
  $("#testBtn").addEventListener("click", () => { unlockAudio(); log("alarm", "알람 테스트"); triggerAlarm("", "테스트 알람입니다. 보드 신호가 아니에요."); });
})();
</script>
</body>
</html>
